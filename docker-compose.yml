services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-trading-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading_dev_password
      POSTGRES_DB: ai_trading
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d ai_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ai-trading-postgres-data
