name: Rotation Snapshot Cron

# 注意：定时触发已迁移到 cron-job.org（精度更高、不受 GH Actions 高峰期延迟影响）
# 详见 docs/plans/2026-05-04-cron-job-org-setup.md
#
# 此 workflow 仅保留 workflow_dispatch（手动触发），用于：
#   - 调试 endpoint 连通性
#   - 补录某个 timeSlot
#   - 验证 GitHub Secrets 配置正确

on:
  workflow_dispatch:
    inputs:
      timeSlot:
        description: '强制指定 timeSlot（可选，留空则按当前北京时间自动判断）'
        type: choice
        options:
          - ''
          - PRE_OPEN
          - '0930'
          - '1030'
          - '1100'
          - '1330'
          - '1430'
          - CLOSE
        default: ''
      force:
        description: '绕过非交易日检查'
        type: boolean
        default: false

jobs:
  trigger:
    name: Trigger /api/rotation/cron
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Build query string
        id: query
        run: |
          slot='${{ github.event.inputs.timeSlot }}'
          force='${{ github.event.inputs.force }}'
          q=''
          [ -n "$slot" ] && q="${q}&timeSlot=${slot}"
          [ "$force" = 'true' ] && q="${q}&force=1"
          echo "qs=${q}" >> "$GITHUB_OUTPUT"

      - name: POST to rotation cron endpoint
        env:
          DEPLOYMENT_URL: ${{ secrets.VERCEL_DEPLOYMENT_URL }}
          TOKEN: ${{ secrets.ROTATION_CRON_TOKEN }}
          QS: ${{ steps.query.outputs.qs }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::Missing secrets VERCEL_DEPLOYMENT_URL or ROTATION_CRON_TOKEN"
            exit 1
          fi

          URL="${DEPLOYMENT_URL%/}/api/rotation/cron${QS:+?${QS#&}}"
          echo "▶ POST ${URL}"

          RESPONSE=$(curl -fsS \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -w "\n---HTTP %{http_code} (%{time_total}s)---" \
            "${URL}")

          echo "$RESPONSE"
